<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Survey Results (Anonymized)</title>
<style>
:root {
  --bg: #f4f6f9;
  --card-bg: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #2f5fa8;
  --border: #d9dee5;
  --accent-bg: #eef2f8;
  --bar-bg: #d9dee5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d;
    --card-bg: #1f2229;
    --text: #e7e9ee;
    --muted: #9aa1ac;
    --primary: #8fb2f0;
    --border: #333844;
    --accent-bg: #262a33;
    --bar-bg: #333844;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Segoe UI", Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
header.top { text-align: center; margin-bottom: 20px; }
header.top h1 { font-size: 1.6rem; margin: 0 0 8px; }
header.top p { color: var(--muted); margin: 4px 0; font-size: 0.95rem; }
nav.jump {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin: 20px 0 32px;
}
nav.jump a {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;
}
section.block { margin-bottom: 40px; }
h2.section-title {
  font-size: 1.2rem; border-bottom: 2px solid var(--primary);
  padding-bottom: 8px; margin-bottom: 18px;
}
.q-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 16px;
}
.q-text { font-weight: 600; margin-bottom: 12px; }
.q-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.03em;}
.scale-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 0.85rem;
}
.scale-row .rlabel { width: 28px; color: var(--muted); flex-shrink: 0; }
.scale-row .bar-outer {
  flex: 1; background: var(--bar-bg); border-radius: 4px; height: 10px; overflow: hidden;
}
.scale-row .bar-inner { height: 100%; background: var(--primary); }
.scale-row .val { width: 18px; text-align: right; font-weight: 600; flex-shrink: 0; }
.avg-line { margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
.avg-line b { color: var(--text); }
.choice-list { list-style: none; margin: 0; padding: 0; }
.choice-list li {
  display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 0.9rem;
}
.choice-list li:last-child { border-bottom: none; }
.choice-list .rlabel { color: var(--muted); font-weight: 600; width: 32px; flex-shrink: 0; }
.quote {
  background: var(--accent-bg); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
  font-size: 0.9rem;
}
.quote .rlabel { font-weight: 700; color: var(--primary); margin-right: 6px; }
.no-answers { color: var(--muted); font-style: italic; font-size: 0.85rem; }
.top-note {
  font-size: 0.85rem; color: var(--muted); text-align: center; margin-bottom: 30px;
  border: 1px dashed var(--border); border-radius: 8px; padding: 10px 16px;
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Team Survey Results — Anonymized</h1>
    <p>All 6 team members responded. Respondents are labeled R1–R6 only; no names, dates, or timestamps are shown.</p>
  </header>
  <div class="top-note">R1–R6 refer to the same person consistently across every question on this page.</div>
  <nav class="jump" id="jump-nav"></nav>
  <div id="content"></div>
</div>

<script>

  E: "E. Team Status Updates (2x / week)",
  F: "F. Feedback on the Team Lead",

const QUESTIONS = [
  // --- A ---

  { id:7, section:"B", type:"scale5", text:"To what extent do you think the team has a real picture of what you're currently doing?", scaleLabels:["not at all","","","","very good picture"],

  { id:10, section:"B", type:"scale5", text:"When you need advice, do you go to someone inside the team first, or do you prefer to contact someone outside the team?", scaleLabels:["always inside the team first","","","","mostly outside the team"],

      "",

      "Calm and expertise.",
      "I value competence, trust, and the space for independent work. At the same time, I know that if needed, I can turn to you for help.",

  { id:34, section:"F", type:"text", text:"Is there something you'd like to tell me but haven't said yet?",
    answers:["Yes.","","","No comment.","No, I don't have anything.","No."] },

function scaleBar(q) {
  let rows = "";
  const nums = q.answers.map(Number);
  const avg = (nums.reduce((a,b)=>a+b,0) / nums.length).toFixed(2);
  q.answers.forEach((v, i) => {
    const pct = (Number(v) / 5) * 100;
    rows += `<div class="scale-row">
      <span class="rlabel">R${i+1}</span>
      <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
      <span class="val">${v}</span>
    </div>`;
  });
  const leftLabel = q.scaleLabels?.[0] || "";
  const rightLabel = q.scaleLabels?.[4] || "";
  return `${rows}<div class="avg-line">${leftLabel} &nbsp;↔&nbsp; ${rightLabel} &middot; Average: <b>${avg}</b>${q.reverse ? " (lower = better)" : ""}</div>`;
}

function percentList(q) {
  return `<ul class="choice-list">${q.answers.map((v,i)=>`<li><span class="rlabel">R${i+1}</span><span>${v}%</span></li>`).join("")}</ul>`;
}

function choiceList(q) {
  return `<ul class="choice-list">${q.answers.map((v,i)=>`<li><span class="rlabel">R${i+1}</span><span>${escapeHtml(v)}</span></li>`).join("")}</ul>`;
}

function textQuotes(q) {
  const nonEmpty = q.answers
    .map((v, i) => ({ v: v.trim(), i }))
    .filter((o) => o.v.length > 0);
  if (nonEmpty.length === 0) return `<div class="no-answers">No responses provided.</div>`;
  return nonEmpty
    .map(
      (o) =>
        `<div class="quote"><span class="rlabel">R${o.i + 1}:</span>${escapeHtml(o.v).replace(/\n/g, "<br>")}</div>`
    )
    .join("");
}

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderQuestion(q) {
  let body = "";
  if (q.type === "scale5") body = scaleBar(q);
  else if (q.type === "percent") body = percentList(q);
  else if (q.type === "choice") body = choiceList(q);
  else if (q.type === "text") body = textQuotes(q);
  return `<div class="q-card">
    <div class="q-meta">Q${q.id}</div>
    <div class="q-text">${escapeHtml(q.text)}</div>
    ${body}
  </div>`;
}

const contentEl = document.getElementById("content");
const navEl = document.getElementById("jump-nav");
let html = "";
let navHtml = "";
for (const key of Object.keys(SECTIONS_META)) {
  const qs = QUESTIONS.filter((q) => q.section === key);
  navHtml += `<a href="#sec-${key}">${key}</a>`;
  html += `<section class="block" id="sec-${key}">
    <h2 class="section-title">${SECTIONS_META[key]}</h2>
    ${qs.map(renderQuestion).join("")}
  </section>`;
}
navEl.innerHTML = navHtml;
contentEl.innerHTML = html;
</script>
</body>
</html>
